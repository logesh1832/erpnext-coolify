# Serves the static demos on erp.plattr.co.in/mock-html.
# Traefik StripPrefix removes /mock-html before proxying here, so nginx sees the
# path at root. Any redirect must re-add the /mock-html prefix explicitly, since
# nginx never sees it (otherwise the browser would land on a route that 404s).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # bare hub-mock dir (no trailing slash) -> full external trailing-slash URL,
    # so relative asset links (assets/..., ../assets/...) resolve correctly.
    location = /hub-mock { return 301 /mock-html/hub-mock/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
