# Serves the static demos under /mock-html on erp.plattr.co.in.
# Coolify/Traefik route the /mock-html prefix here and pass the path through
# unchanged (no prefix stripping), so we serve the tree directly.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # bare prefix -> trailing slash so relative asset links resolve
    location = /mock-html { return 301 /mock-html/; }
    location = /mock-html/hub-mock { return 301 /mock-html/hub-mock/; }

    # serve the whole /mock-html tree (original demo + hub-mock)
    location /mock-html/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # this service only receives /mock-html traffic in production
    location / {
        return 404;
    }
}
