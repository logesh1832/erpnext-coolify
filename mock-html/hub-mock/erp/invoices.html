<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Invoice — Al Nahda ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="surface-erp" data-surface="erp" data-nav="invoices"
      data-step="erp-invoices"
      data-crumbs="Accounts Receivable / Sales Invoice"
      data-hint="This is the company's own ERP, unchanged. The only thing e-invoicing adds is the status column on the right.">

<main class="main">
  <div class="page">

    <div class="page-head">
      <div class="grow">
        <div class="page-title"><h1>Sales Invoice</h1><span class="tag">Al Nahda Trading LLC</span></div>
        <p class="page-sub">Invoices are raised here exactly as they are today.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-sm">Filter</button>
        <button class="btn btn-sm btn-primary">+ New Invoice</button>
      </div>
    </div>

    <div class="grid g3 mb16" id="tiles"></div>

    <div class="card card-tight">
      <div class="card-head">
        <div class="row-tight grow">
          <div class="search" style="width:250px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input input-sm" placeholder="Search invoice or customer">
          </div>
          <select class="select select-sm" style="width:auto">
            <option>Status: All</option><option>Submitted</option><option>Draft</option>
          </select>
        </div>
        <span class="small dim">4 471 records</span>
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>Invoice No.</th>
              <th>Customer</th>
              <th class="r">Grand total (OMR)</th>
              <th>Doc status</th>
              <th>E-Invoice status</th>
              <th class="c">Integration</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="card-foot">
        <span class="small dim" id="more"></span>
        <a class="btn btn-sm btn-primary right" href="../hub/dashboard.html">Follow this invoice into the Hub →</a>
      </div>
    </div>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
  document.getElementById('tiles').innerHTML = [
    stat({ label: 'Submitted today', value: '6', meta: 'Ready for integration', tone: 'var(--accent)' }),
    stat({ label: 'Acknowledged', value: '4', meta: 'Reference written back to ERP', tone: 'var(--ok)' }),
    stat({ label: 'Needs attention', value: '1', meta: 'Rejected by the tax authority', tone: 'var(--fail)' })
  ].join('');

  /* six rows only — chosen so every e-invoice status the column can show is visible */
  const SHOWN = [0, 1, 2, 3, 4, 7].map(i => ERP_INVOICES[i]);

  document.getElementById('rows').innerHTML = SHOWN.map(i => {
    const eKey = i.eStatus === 'Acknowledged' ? 'acknowledged'
               : i.eStatus === 'In Progress' ? 'active'
               : i.eStatus === 'Rejected' ? 'rejected' : 'draft';
    return `<tr>
      <td class="nowrap"><a class="link id" href="../hub/document.html">${i.no}</a>
        ${i.credit ? '<span class="tag" style="margin-left:6px">CN</span>' : ''}</td>
      <td>${i.cust}</td>
      <td class="r num" style="font-weight:600">${omr(i.total)}
        <div class="tiny dim num" style="font-weight:400">net ${omr(i.net)} + VAT ${omr(i.vat)}</div></td>
      <td>${pill(i.docStatus === 'Submitted' ? 'submitted' : 'draft', i.docStatus)}</td>
      <td>${i.eStatus === 'Not Applicable' ? '<span class="dim small">—</span>' : pill(eKey, i.eStatus)}
        ${i.qr ? '<span class="tag" style="margin-left:6px">QR</span>' : ''}</td>
      <td class="c">${i.ready
        ? '<span class="pill pill-accent"><i class="dot"></i>Ready</span>'
        : '<span class="small dim">Not submitted</span>'}</td>
    </tr>`;
  }).join('');

  document.getElementById('more').textContent =
    '+ ' + (ERP_INVOICES.length - SHOWN.length) + ' more on this page — picked up automatically, no manual export.';
</script>
</body>
</html>
