<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapping Studio — Nazm Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="surface-hub" data-surface="hub" data-nav="mapping"
      data-step="hub-mapping"
      data-crumbs="Configuration / Mapping Studio"
      data-hint="Each company's ERP field names are pointed at the standard invoice fields. This is configuration an analyst does once per company — not code.">

<main class="main">
  <div class="page">

    <div class="page-head">
      <div class="grow">
        <div class="page-title">
          <h1>Mapping Studio</h1>
          <span class="pill pill-ok"><i class="dot"></i>Profile ANT/v7 published</span>
          <span class="tier">SAP S/4HANA Cloud</span>
        </div>
        <p class="page-sub">One ERP field is pointed at one standard field — that is all a mapping is.</p>
      </div>
      <div class="page-actions">
        <select class="select select-sm" style="width:auto">
          <option>Al Nahda Trading — ANT/v7 (published)</option>
          <option>Muscat Steel — MSI/v5</option>
          <option>Gulf Logistics — GLC/v3</option>
        </select>
        <button class="btn btn-sm btn-primary">Publish new version</button>
      </div>
    </div>

    <div class="grid g3 mb16" id="tiles"></div>

    <section style="margin-top:0">
      <div class="tabs" id="tabs">
        <button class="tab is-active" data-tab="all">All fields</button>
        <button class="tab" data-tab="parties">Buyer party</button>
        <button class="tab" data-tab="unmapped">Unmapped</button>
      </div>

      <div class="card card-tight">
        <div class="card-head">
          <h2 class="grow">Field bindings — profile ANT/v7</h2>
          <span class="pill pill-accent"><i class="dot"></i><span id="shown">8</span> shown</span>
        </div>
        <div id="mapTable"></div>
        <div class="card-foot">
          <span class="small dim">8 of 47 field bindings shown</span>
        </div>
      </div>
    </section>

    <section>
      <div class="card">
        <div class="card-head">
          <h2 class="grow">Live preview</h2>
          <span class="tag">ANT-SINV-2026-04471</span>
        </div>
        <div class="card-body">
          <div class="grid g2">
            <div>
              <div class="eyebrow mb8">Before — what the ERP sends</div>
              <div class="code" id="srcJson"></div>
            </div>
            <div>
              <div class="eyebrow mb8">After — the standard invoice</div>
              <div class="code code-lines" id="outXml"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="gaps"></section>

  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
  /* where each ERP field actually comes from, for the rows shown here */
  const SRC = {
    'BillingDocument':      'SAP · VBRK-VBELN',
    'BillingDocumentDate':  'SAP · VBRK-FKDAT · yyyymmdd',
    'CustomerCode':         'SAP · VBRK-KUNRG · payer',
    'CustomerName':         'SAP · KNA1-NAME1',
    'TaxAmount':            'SAP · VBRK-MWSBK',
    'InvoiceTotal':         'SAP · NETWR + MWSBK',
    '—':                    'Not in the ERP — generated by the Hub',
    '(not exposed)':        'Absent from the ERP feed'
  };

  /* eight representative bindings, taken from the full profile */
  const PICK = [
    { grp: 'Document header', tab: 'header',
      rows: [MAPPING[0].rows[0], MAPPING[0].rows[1], MAPPING[0].rows[5]] },
    { grp: 'Buyer party', tab: 'parties',
      rows: [MAPPING[2].rows[0], MAPPING[2].rows[1], MAPPING[2].rows[4]] },
    { grp: 'Monetary totals', tab: 'totals',
      rows: [MAPPING[3].rows[1], MAPPING[3].rows[2]] }
  ];

  /* --- summary tiles -------------------------------------------------------- */
  document.getElementById('tiles').innerHTML = [
    stat({ label: 'Fields resolved', value: '47<span style="font-size:15px;color:var(--text-lo)"> / 47</span>',
           meta: 'Complete for this company', tone: 'var(--ok)' }),
    stat({ label: 'Transformations applied', value: '12',
           meta: 'Dates, code lists, decimals', tone: 'var(--info)' }),
    stat({ label: 'Needing a fallback', value: '2',
           meta: 'Neither blocks submission', tone: 'var(--warn)' })
  ].join('');

  /* --- the mapping table ---------------------------------------------------- */
  const chip = (txt, col) =>
    `<span class="tag" style="font-size:9.5px;padding:1px 5px;color:${col};border-color:color-mix(in srgb, ${col} 30%, transparent);background:color-mix(in srgb, ${col} 10%, transparent)">${txt}</span>`;

  let html = `<div class="map-row head">
      <div>ERP field</div>
      <div></div>
      <div>Standard invoice field</div>
      <div style="text-align:right">Transform</div>
    </div>`;

  PICK.forEach(g => {
    html += `<div class="map-row head" data-ghead="1" data-tab="${g.tab}"
        style="grid-template-columns:minmax(0,1fr) auto;color:var(--accent-hi)">
        <div>${g.grp}</div>
        <div style="color:var(--text-lo)">${g.rows.length} fields</div>
      </div>`;

    g.rows.forEach(r => {
      const bad = r.ok === false;
      const right = bad
        ? chip('fallback', 'var(--warn)')
        : (r.xf ? `<span class="xf">${r.xf}</span>` : `<span class="tiny dim">copy</span>`);

      html += `<div class="map-row${bad ? ' unmapped' : ''}" data-tab="${g.tab}" data-ok="${!bad}">
        <div class="map-field">
          <div class="map-name">${r.erp}${r.derived ? ' ' + chip('derived', 'var(--info)') : ''}</div>
          <div class="map-note">${SRC[r.erp] || 'SAP · billing document feed'}</div>
        </div>
        ${mapArrow()}
        <div class="map-field">
          <div class="map-name">${r.std}</div>
          <div class="map-note">${r.stdName}</div>
        </div>
        <div style="display:flex;justify-content:flex-end">${right}</div>
      </div>`;
    });
  });

  document.getElementById('mapTable').innerHTML = html;

  /* --- tab filtering -------------------------------------------------------- */
  const tabsEl = document.getElementById('tabs');
  const rows = () => Array.from(document.querySelectorAll('#mapTable .map-row[data-tab]'));

  function applyTab(key) {
    rows().forEach(el => {
      const isHead = el.hasAttribute('data-ghead');
      let show;
      if (key === 'all') show = true;
      else if (key === 'unmapped') show = isHead ? false : el.dataset.ok === 'false';
      else show = el.dataset.tab === key;
      el.style.display = show ? '' : 'none';
    });
    document.getElementById('shown').textContent =
      rows().filter(el => el.style.display !== 'none' && !el.hasAttribute('data-ghead')).length;
  }

  tabsEl.addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('is-active'));
    b.classList.add('is-active');
    applyTab(b.dataset.tab);
  });
  applyTab('all');

  /* --- live preview --------------------------------------------------------- */
  document.getElementById('srcJson').textContent =
`{
  "BillingDocument":     "0090114471",
  "BillingDocumentDate": "20260731",
  "TransactionCurrency": "OMR",
  "CustomerCode":        "CUST-00412",
  "CustomerName":        "  oman oil marketing co. saog ",
  "TaxAmount":           "1240.00"
}`;

  document.getElementById('outXml').innerHTML = xml(
`<cbc:ID>ANT-SINV-2026-04471</cbc:ID>
<cbc:IssueDate>2026-07-31</cbc:IssueDate>
<cbc:DocumentCurrencyCode>OMR</cbc:DocumentCurrencyCode>
<cac:AccountingCustomerParty>
  <cbc:ID>CUST-00412</cbc:ID>
  <cbc:Name>OMAN OIL MARKETING CO. SAOG</cbc:Name>
</cac:AccountingCustomerParty>
<cbc:TaxAmount currencyID="OMR">1240.000</cbc:TaxAmount>`);

  /* --- unmapped fields ------------------------------------------------------ */
  document.getElementById('gaps').innerHTML = notice('warn',
    `<b>Two of the 47 fields cannot be read from this ERP — both are already covered.</b>
     <div class="small muted mt4">The buyer address falls back to the address held in the Hub, and the item
       classification code is optional under the standard. Neither blocks submission.</div>`);
</script>
</body>
</html>
